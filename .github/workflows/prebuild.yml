name: prebuild

on:
  workflow_call:
    inputs:
      apiOrigin:
        description: The Tumpel API the run reads its inputs from and uploads its layer to
        required: true
        type: string

jobs:
  inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      id-token: write
    outputs:
      prebuildId: ${{ steps.read.outputs.prebuildId }}
      tenantId: ${{ steps.read.outputs.tenantId }}
      rootfsUrl: ${{ steps.read.outputs.rootfsUrl }}
      imageDigest: ${{ steps.read.outputs.imageDigest }}
    env:
      API_ORIGIN: ${{ inputs.apiOrigin }}
    steps:
      - name: Read the prebuild's inputs
        id: read
        run: |
          token=$(curl --fail --silent --show-error --max-time 30 \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$API_ORIGIN" | jq --raw-output .value)
          echo "::add-mask::$token"
          status=$(curl --silent --show-error --max-time 30 --request POST \
            --header "Authorization: Bearer $token" \
            --output "$RUNNER_TEMP/inputs.json" --write-out '%{http_code}' \
            "$API_ORIGIN/v1/prebuild-inputs")
          if [ "$status" != 200 ]; then
            echo "::error::POST $API_ORIGIN/v1/prebuild-inputs answered $status: $(cat "$RUNNER_TEMP/inputs.json")"
            exit 1
          fi
          for name in prebuildId tenantId rootfsUrl imageDigest; do
            echo "$name=$(jq --raw-output ".$name" "$RUNNER_TEMP/inputs.json")" >> "$GITHUB_OUTPUT"
          done

  build:
    needs: inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      ROOTFS_URL: ${{ needs.inputs.outputs.rootfsUrl }}
      IMAGE: tumpel-guest:${{ needs.inputs.outputs.imageDigest }}
    steps:
      - name: Import the guest image
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/rootfs.tar" "$ROOTFS_URL"
          docker import --platform linux/amd64 "$RUNNER_TEMP/rootfs.tar" "$IMAGE"
          rm "$RUNNER_TEMP/rootfs.tar"
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          path: workspace
          persist-credentials: false
      - name: Build the layer
        run: |
          mkdir -p out
          docker run --rm --platform linux/amd64 \
            --volume "$GITHUB_WORKSPACE/workspace:/root/workspace" \
            --volume "$GITHUB_WORKSPACE/out:/out" \
            "$IMAGE" /opt/tumpel/node/bin/node /opt/tumpel/prebuild.mjs build /out
      - name: Keep the layer
        uses: actions/upload-artifact@v4
        with:
          name: tumpel-prebuild-${{ needs.inputs.outputs.prebuildId }}
          path: |
            out/layer.tar
            out/layer.json
          retention-days: 1
          if-no-files-found: error

  upload:
    needs: [inputs, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    env:
      ROOTFS_URL: ${{ needs.inputs.outputs.rootfsUrl }}
      API_ORIGIN: ${{ inputs.apiOrigin }}
      TENANT_ID: ${{ needs.inputs.outputs.tenantId }}
      PREBUILD_ID: ${{ needs.inputs.outputs.prebuildId }}
    steps:
      - name: Extract the upload script from the guest image
        run: |
          mkdir -p "$RUNNER_TEMP/guest"
          curl --fail --silent --show-error --location "$ROOTFS_URL" \
            | tar --extract --directory "$RUNNER_TEMP/guest" --wildcards --wildcards-match-slash --no-anchored \
              'opt/tumpel/prebuild.mjs' 'opt/tumpel/node/*'
          test -f "$RUNNER_TEMP/guest/opt/tumpel/prebuild.mjs"
      - name: Fetch the layer
        uses: actions/download-artifact@v4
        with:
          name: tumpel-prebuild-${{ needs.inputs.outputs.prebuildId }}
          path: out
      - name: Upload the layer
        run: |
          "$RUNNER_TEMP/guest/opt/tumpel/node/bin/node" "$RUNNER_TEMP/guest/opt/tumpel/prebuild.mjs" \
            upload out "$API_ORIGIN" "$TENANT_ID" "$PREBUILD_ID"
