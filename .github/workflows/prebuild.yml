name: prebuild

on:
  workflow_call:
    inputs:
      prebuildId:
        description: The prebuild Tumpel started
        required: true
        type: string
      tenantId:
        description: The tenant that started the prebuild
        required: true
        type: string
      apiOrigin:
        description: The Tumpel API the upload job calls
        required: true
        type: string
      rootfsUrl:
        description: A presigned GET of the guest image's root filesystem tar
        required: true
        type: string
      imageDigest:
        description: The digest of the guest image the layer is built on
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      ROOTFS_URL: ${{ inputs.rootfsUrl }}
      IMAGE: tumpel-guest:${{ inputs.imageDigest }}
    steps:
      - name: Import the guest image
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/rootfs.tar" "$ROOTFS_URL"
          docker import --platform linux/amd64 "$RUNNER_TEMP/rootfs.tar" "$IMAGE"
          rm "$RUNNER_TEMP/rootfs.tar"
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          path: workspace
          persist-credentials: false
      - name: Build the layer
        run: |
          mkdir -p out
          docker run --rm --platform linux/amd64 \
            --volume "$GITHUB_WORKSPACE/workspace:/root/workspace" \
            --volume "$GITHUB_WORKSPACE/out:/out" \
            "$IMAGE" /opt/tumpel/node/bin/node /opt/tumpel/prebuild.mjs build /out
      - name: Keep the layer
        uses: actions/upload-artifact@v4
        with:
          name: tumpel-prebuild-${{ inputs.prebuildId }}
          path: |
            out/layer.tar
            out/layer.json
          retention-days: 1
          if-no-files-found: error

  upload:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    env:
      ROOTFS_URL: ${{ inputs.rootfsUrl }}
      API_ORIGIN: ${{ inputs.apiOrigin }}
      TENANT_ID: ${{ inputs.tenantId }}
      PREBUILD_ID: ${{ inputs.prebuildId }}
    steps:
      - name: Extract the upload script from the guest image
        run: |
          mkdir -p "$RUNNER_TEMP/guest"
          curl --fail --silent --show-error --location "$ROOTFS_URL" \
            | tar --extract --directory "$RUNNER_TEMP/guest" --wildcards --wildcards-match-slash --no-anchored \
              'opt/tumpel/prebuild.mjs' 'opt/tumpel/node/*'
          test -f "$RUNNER_TEMP/guest/opt/tumpel/prebuild.mjs"
      - name: Fetch the layer
        uses: actions/download-artifact@v4
        with:
          name: tumpel-prebuild-${{ inputs.prebuildId }}
          path: out
      - name: Upload the layer
        run: |
          "$RUNNER_TEMP/guest/opt/tumpel/node/bin/node" "$RUNNER_TEMP/guest/opt/tumpel/prebuild.mjs" \
            upload out "$API_ORIGIN" "$TENANT_ID" "$PREBUILD_ID"
